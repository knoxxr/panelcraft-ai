services:
  postgres:
    image: postgres:16-alpine
    container_name: panelcraft-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panelcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panelcraft_secret}
      POSTGRES_DB: ${POSTGRES_DB:-panelcraft}
    volumes:
      - panelcraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panelcraft"]
      interval: 10s
      timeout: 5s
      retries: 5

  panelcraft-api:
    build: .
    container_name: panelcraft-ai-saas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PANELCRAFT_DB_PATH=/data/panelcraft.db
      - DATABASE_URL=${DATABASE_URL:-postgresql://panelcraft:panelcraft_secret@postgres:5432/panelcraft}
    volumes:
      - panelcraft_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: panelcraft-ai-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - panelcraft-api

volumes:
  panelcraft_data:
  panelcraft_pgdata:
