appId: ai.panelcraft.desktop
productName: PanelCraft AI
copyright: Copyright © 2026 PanelCraft AI Contributors

directories:
  output: ../dist/desktop
  buildResources: build

files:
  - main.js
  - preload.js
  - build/**/*

extraResources:
  - from: ../dist/backend
    to: backend
    filter:
      - "**/*"

publish:
  - provider: github
    owner: knoxxr
    repo: panelcraft-ai

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]

linux:
  icon: build/icon.png
  category: Development;Engineering
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
